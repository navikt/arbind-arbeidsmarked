project:
  type: book
  output-dir: _book
date: now
date-format: DD.MM.YYYY
author-title: Eier
book:
  title: 'Navs arbeidsindikator og arbeidsmarkedet'
  description: >
    Evaluerer om Navs arbeidsindikatorer i tilstrekkelig grad kontrollerer for
    arbeidsmarkedet. Analyserer sammenhengen mellom indikatorer og
    arbeidsmarkedsforhold, og diskuterer mulige forbedringer og veien videre.
  author: Jacob Sjødin
  chapters:
  - index.qmd
  - part: datagrunnlag/intro.qmd
    chapters:
    - datagrunnlag/rapport.qmd
  - part: stramhet/intro.qmd
    chapters:
    - stramhet/jobb/rapport.qmd
    - stramhet/atid/rapport.qmd
    - stramhet/ssb_stramhet.qmd
    - stramhet/ssb_stramhet_sensitivitet.qmd
  - part: mismatch/intro.qmd
    chapters:
    - mismatch/yrke.qmd
    - mismatch/sensitivitet.qmd
  - konklusjon.qmd

  appendices:
  - appendiks.qmd

  page-navigation: true
  page-footer: Nav - {{< meta date >}}
  repo-url: https://github.com/navikt/arbind-arbeidsmarked
  reader-mode: false
  search: true
  navbar:
    logo: assets/nav_logo_hvit.png
    logo-alt: Logo til Nav - Arbeids- og velferdsetaten
format:
  html:
    lang: nb
    toc: true
    toc-depth: 3
    theme:
      light: flatly
      dark: darkly
